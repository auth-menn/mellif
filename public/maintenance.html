<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <meta name="theme-color" content="#171713">
        <title>Situs Sedang Dalam Perbaikan - Mellif Studio</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Arial, Helvetica, sans-serif;
                background: #f5f3ee;
                color: #25241f;
                font-synthesis: none;
                text-rendering: optimizeLegibility;
            }

            * { box-sizing: border-box; }

            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                padding: 28px;
                place-items: center;
            }

            main {
                width: min(100%, 680px);
                padding: clamp(32px, 8vw, 76px);
                border: 1px solid #e2dfd6;
                background: #fffefa;
                text-align: center;
            }

            .brand {
                margin: 0 0 72px;
                color: #171713;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 25px;
                font-style: italic;
                letter-spacing: -1.5px;
            }

            .eyebrow {
                margin: 0 0 18px;
                color: #8b765e;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 3px;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: clamp(38px, 8vw, 60px);
                font-weight: 400;
                letter-spacing: -2px;
                line-height: 1.08;
            }

            .message {
                max-width: 430px;
                margin: 24px auto 0;
                color: #69675f;
                font-size: 15px;
                line-height: 1.8;
            }

            .rule {
                width: 42px;
                height: 1px;
                margin: 36px auto 0;
                background: #b99b77;
            }

            @media (max-width: 480px) {
                body { padding: 16px; }
                .brand { margin-bottom: 56px; }
            }
        </style>
    </head>
    <body>
        <main>
            <p class="brand">Mellif Studio</p>
            <p class="eyebrow">Mohon maaf</p>
            <h1>Website sedang dalam perbaikan</h1>
            <p class="message">
                Kami sedang melakukan pemeliharaan agar Mellif Studio dapat
                kembali melayani Anda dengan lebih baik. Silakan kunjungi
                kembali beberapa saat lagi.
            </p>
            <div class="rule" aria-hidden="true"></div>
        </main>
    </body>
</html>
